version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OSRM_BASE_URL=http://router.project-osrm.org
      - ROUTE_CORRIDOR_MILES=25.0
      - MAX_RANGE_MILES=500.0
      - MPG=10.0
      - TANK_CAPACITY_GALLONS=50.0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
